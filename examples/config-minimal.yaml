# Минимальный пример конфигурации fstab-edit.
#
# Файл содержит только ключи, значения которых отличаются от встроенных
# дефолтов (см. examples/config-full.yaml). Незаданные ключи берутся
# из дефолтов и других уровней приоритета (ТЗ §13.1):
#   CLI-флаги > FSTAB_EDIT_* env > user YAML > system YAML > defaults.
#
# Куда положить:
#   - пользовательский конфиг: ~/.config/fstab-edit/config.yaml
#     (автоматически загружается только для не-root процессов, ТЗ §13.2);
#   - системный конфиг: /etc/fstab-edit/config.yaml (только root-ownership);
#   - либо передать явно: fstab-edit --config /путь/к/этому/файлу ...
#
# Требования безопасности (ТЗ §13.2): файл не должен быть доступен на запись
# group/others (chmod 0644 или строже), symlink-конфигурация отклоняется.
# Неизвестные YAML-ключи вызывают ошибку конфигурации (exit code 2).

# Целевой файл вместо дефолтного /etc/fstab (удобно для chroot и тестов).
fstab_path: /mnt/chroot/etc/fstab

# Хранить резервные копии в отдельном каталоге вместо каталога target.
backup:
  dir: /var/backups/fstab-edit
